const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280,H=720;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function pill(x,y,w,h,fill,stroke){rr(x,y,w,h,12);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size,color,align,weight){ctx.fillStyle=color||'#fff';ctx.font=(weight||'bold')+' '+size+'px Verdana,Arial,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function textBox(s,x,y,size,color,align){const w=ctx.measureText(s).width+22;ctx.font='bold '+size+'px Verdana,Arial,sans-serif';const ww=ctx.measureText(s).width+22;pill(align==='center'?x-ww/2:align==='right'?x-ww:x,y-15,ww,30,'rgba(20,10,2,0.78)','#ffd27a');text(s,x,y,size,color,align)}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide){if(G.muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.setValueAtTime(v||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function sfx(n){if(n==='gobble'){tone(300,.12,'square',.14,520);setTimeout(()=>tone(260,.12,'square',.12,480),110);setTimeout(()=>tone(340,.15,'square',.12,560),220)}
 else if(n==='coin'){tone(880,.09,'sine',.12,1320)} else if(n==='jump'){tone(300,.15,'sine',.1,640)}
 else if(n==='hit'){tone(160,.25,'sawtooth',.16,70)} else if(n==='burst'){tone(500,.3,'triangle',.16,1200);tone(900,.2,'sine',.1,1800)}
 else if(n==='stun'){tone(700,.2,'sine',.12,350)} else if(n==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.13),i*130))}
 else if(n==='lose'){[400,300,200,140].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sawtooth',.1),i*140))}}

function startTheme(){if(themeTimer)return;const notes=[392,440,523,587,659,523,440,392];let i=0;themeTimer=setInterval(()=>{if(!G.muted&&G.screen==='title')tone(notes[i++%notes.length],.28,'triangle',.05)},300)}
/* ---------- helpers ---------- */
function gradeFor(s){return s>=9000?'S':s>=6000?'A':s>=3500?'B':'C'}

 G.burst=G.burstMax;G.gobble=100;G.prox=22;G.stun=0;G.burstFx=0;G.decoy=null;G.runT=0;G.event=EVENTS[leg%4];G.eventT=999;
 obstacles=[];pickups=[];feathers=[];player={x:230,y:520,vy:0,ground:true,duck:false,flap:0};
 rng=mulberry32(G.seed+leg*7919);spawnT=0;
 G.msg=LEGS[leg].name+' — GO!';G.msgT=180;G.screen='run'}
function addScore(n){G.score+=n;G.legScore+=n}
function addCorn(n,kind){const mult=G.event&&G.event.n==='RAIN SHOWER'?2:1;const v=n*mult;G.corn+=v;G.totalCorn+=v;G.legCorn+=v;G.combo=Math.min(5,G.combo+0.1);G.bestCombo=Math.max(G.bestCombo,Math.floor(G.combo));G.burst=Math.min(G.burstMax,G.burst+0.15);if(kind==='goldcorn'){G.corn+=4;G.legCorn+=4} sfx('coin')}
function hurt(kind){if(G.upgrades.scarf&&kind==='oven')return;if(G.upgrades.legs&&!G._legsUsed){G._legsUsed=true;G.msg='Sturdy Legs saved you!';G.msgT=120;return}
 G.lives--;G.combo=1;G.prox=Math.min(96,G.prox+22);G.shake=14;sfx('hit');G.msg=kind==='oven'?'OVEN HEAT! -1 heart':kind==='knife'?'KNIFE! -1 heart':'OUCH! -1 heart';G.msgT=120;
 if(G.lives<=0)caught()}
function caught(){G.screen='over';sfx('lose')}
function completeLeg(){const s=G.legScore+G.legCorn*10+Math.floor(G.distance);G.score+=0;const sc=G.legScore+G.legCorn*10;
 G.legScores[G.leg]=sc;G.cleared[G.leg]=true;G.grade=gradeFor(sc);G.results={leg:G.leg,score:sc,corn:G.legCorn,combo:G.bestCombo,grade:G.grade};
 G.screen='results';sfx('win')}
function featherBurst(){if(G.burst<1||G.screen!=='run')return;G.burst--;G.burstFx=40;G.decoy={x:player.x+60,y:player.y,t:90};
 for(let i=0;i<26;i++)feathers.push({x:player.x+20,y:player.y,rng:Math.random()*6.28,sp:2+Math.random()*4,life:50});
 G.prox=Math.max(4,G.prox-30);G.msg='FEATHER BURST!';G.msgT=90;sfx('burst')}
function gobble(){if(G.gobble<30||G.screen!=='run')return;G.gobble-=30;sfx('gobble');
 if(Math.random()<0.75){G.stun=120;G.msg='GOBBLE STUN! Hank frozen 2s';G.msgT=100;sfx('stun')}else{G.msg='Gobble alerted Biscuit! He speeds up!';G.msgT=100;G.prox=Math.min(96,G.prox+10)}}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u||G.upgrades[id])return false;if(G.corn<u.price)return false;G.corn-=u.price;G.upgrades[id]=true;if(id==='pouch')G.burstMax=2;return true}
function saveSlot(i){G.saveSlots[i]={corn:G.corn,score:G.score,cleared:G.cleared.slice(),upgrades:Object.assign({},G.upgrades),legScores:G.legScores.slice(),bestCombo:G.bestCombo};persistSaves();G.saveMsg='Saved to slot '+(i+1)}
function loadSlot(i){const s=G.saveSlots[i];if(!s)return false;G.corn=s.corn;G.score=s.score;G.cleared=s.cleared.slice();G.upgrades=Object.assign({},s.upgrades);G.legScores=s.legScores.slice();G.bestCombo=s.bestCombo||1;G.burstMax=G.upgrades.pouch?2:1;G.saveMsg='Loaded slot '+(i+1);return true}
/* ---------- drawing: characters (drawn canvas art, no emoji) ---------- */

 text('SPACE gobble · SHIFT Feather Burst · UP/W jump · P pause',640,700,13,'#ffe9b0','center');}
function drawResults(){const r=G.results;drawBackground(G.leg,G.runT);
 pill(340,60,600,90,'rgba(20,10,2,0.85)','#ffd27a');text('LEG '+(r.leg+1)+' COMPLETE!',640,100,32,'#ffd27a','center');text(LEGS[r.leg].name,640,132,16,'#fff','center');
 pill(240,170,800,300,'rgba(20,10,2,0.88)','#ffd27a');
 text('GRADE  '+r.grade,640,210,44,r.grade==='S'?'#ffd700':'#7ad95d','center');
 text('Score '+r.score+'   ·   Corn +'+r.corn+'   ·   Best combo x'+r.combo,640,262,19,'#fff','center');
 text('Henrietta: "Flap like you mean it — and you did!"',640,292,15,'#ffe9b0','center');
 // per-leg bar chart
 text('SCORE PER LEG',640,330,15,'#ffd27a','center');
 G.legScores.forEach((s,i)=>{const bw=Math.min(90,s/40);ctx.fillStyle=i===r.leg?'#e8a83a':'#7ab0e8';ctx.fillRect(300+i*105,360,60,bw);text('L'+(i+1),330+i*105,360+bw+16,12,'#fff','center');text(String(s),330+i*105,352,11,'#fff','center')});
 drawButtons([{x:340,y:500,w:220,h:54,label:'NEXT LEG',fn:()=>{if(G.leg<6)resetRun(G.leg+1);else G.screen='escaped'}},{x:600,y:500,w:220,h:54,label:'MAP',fn:()=>{G.screen='map'}},{x:860,y:500,w:180,h:54,label:'SHOP',fn:()=>{G.screen='shop'}}]);
 text('Total score '+G.score+' · Total corn '+G.totalCorn+' · Legs cleared '+G.cleared.filter(Boolean).length+'/7',640,590,15,'#ffe9b0','center');}
function drawOver(){drawBackground(3,G.runT);
 pill(240,180,800,220,'rgba(20,10,2,0.9)','#e83a2e');text('CAUGHT!',640,240,52,'#ff6a5a','center');text('ON THE MENU… Hank got you!',640,300,22,'#fff','center');
 text('Gobble ran '+Math.floor(G.distance)+'m and gathered '+G.legCorn+' corn on leg '+(G.leg+1)+'.',640,340,16,'#ffe9b0','center');
 text('Cook Marge is already sharpening the knife. Try again, birdie.',640,368,14,'#fff','center');
 drawButtons([{x:340,y:440,w:220,h:54,label:'RETRY LEG',fn:()=>resetRun(G.leg)},{x:600,y:440,w:220,h:54,label:'BACK TO MAP',fn:()=>{G.screen='map'}}]);
 text('Score '+G.score+' · Corn '+G.corn,640,530,15,'#ffe9b0','center');}
function drawEscaped(){drawBackground(6,G.runT);
 pill(240,120,800,260,'rgba(20,10,2,0.9)','#7ad95d');text('FREE!',640,180,56,'#7ad95d','center');text('The Wild Woods welcome you, Gobble.',640,240,22,'#fff','center');
 text('Seven fences. One farmer. Zero dinners.',640,278,17,'#ffe9b0','center');
 text('Auntie Maple: "The woods remember the fast ones, dear."',640,312,15,'#fff','center');
 text('FINAL GRADE '+gradeFor(G.score)+'  ·  Score '+G.score+'  ·  Corn '+G.totalCorn+'  ·  Best combo x'+G.bestCombo,640,348,16,'#ffd27a','center');
 drawButtons([{x:440,y:420,w:400,h:54,label:'PLAY AGAIN (BACK TO MAP)',fn:()=>{G.screen='map'}}]);
 text('Thank you for playing Gobble\'s Great Escape!',640,510,15,'#ffe9b0','center');}
/* ---------- update ---------- */
function update(){if(G.paused||G.screen!=='run'||G.shot)return;G.runT++;const speed=runSpeed+(G.upgrades.boots?1.2:0)+(G.event&&G.event.n==='FEED-TIME RUSH'?0:0);
 G.distance+=speed*0.12;G.gobble=Math.min(100,G.gobble+0.08);
 if(G.stun>0)G.stun--;else G.prox=Math.min(96,G.prox+0.02*(G.upgrades.quiet?0.4:1));
 if(G.burstFx>0)G.burstFx--;if(G.decoy){G.decoy.t--;if(G.decoy.t<=0)G.decoy=null}
 if(G.msgT>0)G.msgT--;if(G.shake>0)G.shake--;
 // physics
 player.vy+=0.9;player.y+=player.vy;if(player.y>=520){player.y=520;player.vy=0;player.ground=true}
 player.flap+=0.2;
 // spawn
 spawnT-=speed;if(spawnT<=0){spawnT=260+Math.random()*220;const L=LEGS[G.leg];const type=L.haz[Math.floor(Math.random()*L.haz.length)];
  obstacles.push({type,x:1300,y:groundY,w:60,h:60,t:0});
  if(Math.random()<0.8){const kind=Math.random()<0.08?'goldcorn':Math.random()<0.15?'feather':'corn';pickups.push({kind,x:1250+Math.random()*80,y:480+Math.random()*60})}}
 for(const o of obstacles){o.x-=speed;o.t=(o.t||0)+0.1}
 for(const p of pickups){p.x-=speed;if(G.upgrades.magnet&&Math.abs(p.x-player.x)<140){p.x+=(player.x-p.x)*0.12;p.y+=(player.y-p.y)*0.12}}
 for(const f of feathers){f.x-=2;f.y+=1;f.life--;if(f.life<=0)feathers.splice(feathers.indexOf(f),1)}
 obstacles=obstacles.filter(o=>o.x>-160);pickups=pickups.filter(p=>p.x>-60);
 // collisions
 for(const o of obstacles){if(!o.hit&&Math.abs(o.x-player.x)<52&&player.y>groundY-110){o.hit=true;hurt(o.type==='oven'?'oven':o.type==='knife'?'knife':'fence')}}
 for(const p of pickups){if(!p.got&&Math.abs(p.x-player.x)<46&&Math.abs(p.y-player.y)<70){p.got=true;addCorn(p.kind==='goldcorn'?5:1,p.kind);addScore(p.kind==='goldcorn'?50:10)}}
 pickups=pickups.filter(p=>!p.got);
 if(G.distance>=legLen(G.leg)){if(G.leg===6){G.screen='escaped';sfx('win')}else completeLeg()}
 if(G.prox>=96)caught();}
function render(){ctx.save();if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
 if(G.screen==='title')drawTitle();else if(G.screen==='map')drawMap();else if(G.screen==='shop')drawShop();
 else if(G.screen==='run')drawRun();else if(G.screen==='results')drawResults();else if(G.screen==='over')drawOver();else if(G.screen==='escaped')drawEscaped();
 ctx.restore()}
function loop(){update();render();requestAnimationFrame(loop)}
/* ---------- input ---------- */
function doJump(){if(G.screen==='run'&&player.ground){player.vy=-17;player.ground=false;sfx('jump')}}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='m'){G.muted=!G.muted;return}
 if(k==='p'&&G.screen==='run'){G.paused=!G.paused;return}
 if(k==='enter'){if(G.screen==='title'){G.screen='map';sfx('coin')}else if(G.screen==='results'){if(G.leg<6)resetRun(G.leg+1)}return}
 if(k===' '||k==='arrowup'||k==='w'){e.preventDefault();if(G.screen==='run'){if(k===' ')gobble();else doJump()}else if(G.screen==='title'){G.screen='map'}}
 if(k==='shift'){featherBurst()}
 if(k==='arrowdown'||k==='s'){player.duck=true}
 if(k==='escape'&&G.screen==='run'){G.screen='map'}});
window.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='arrowdown'||e.key.toLowerCase()==='s')player.duck=false});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)*1280/r.width,my=(e.clientY-r.top)*720/r.height;
 if(G.screen==='shop'&&G._nav){for(const b of G._nav){if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){b.fn();return}}}
 if(clickButtons(mx,my))return;
 if(G.screen==='run'){const y=my;if(y<300)doJump();else gobble()}});
startTheme();
/* ---------- ?shot= staging (deterministic) ---------- */
const params=new URLSearchParams(location.search);const shot=params.get('shot');G.shot=shot;
if(shot==='title'){G.screen='title';G.cleared=[true,true,false,false,false,false,false];G.score=1250;G.corn=86}
else if(shot==='play'){G.corn=86;G.score=3420;G.leg=1;G.screen='run';G.distance=642;G.combo=3;G.bestCombo=4;G.burst=1;G.gobble=72;G.prox=30;G.burstFx=32;G.decoy={x:420,y:500,t:90};G.event=EVENTS[3];G.lives=3;G._legsUsed=false;
 player={x:230,y:470,vy:0,ground:false,duck:false,flap:1};G.showBiscuit=true;
 obstacles=[{type:'fence',x:900,y:groundY,w:60,h:60,t:0},{type:'scarecrow',x:1120,y:groundY,w:60,h:60,t:0}];
 pickups=[{kind:'corn',x:520,y:480},{kind:'corn',x:580,y:470},{kind:'corn',x:640,y:480},{kind:'goldcorn',x:760,y:460},{kind:'corn',x:980,y:500}];
 for(let i=0;i<18;i++)feathers.push({x:230+Math.random()*120-40,y:470+Math.random()*60-20,rng:Math.random()*6.28,sp:2,life:50});
 G.msg='FEATHER BURST!';G.msgT=999}
else if(shot==='barn'){G.corn=120;G.score=5100;G.leg=3;G.screen='run';G.distance=480;G.combo=2;G.bestCombo=3;G.burst=1;G.gobble=55;G.prox=44;G.event=EVENTS[0];G.lives=2;
 player={x:230,y:520,vy:0,ground:true,duck:false,flap:1};
 obstacles=[{type:'oven',x:760,y:groundY,w:110,h:96,t:0},{type:'knife',x:920,y:groundY,w:40,h:60,t:0.4},{type:'hay',x:560,y:groundY,w:60,h:60,t:0}];
 pickups=[{kind:'corn',x:420,y:480},{kind:'corn',x:480,y:480},{kind:'corn',x:640,y:500}];G.msg="Cook Marge: \"The oven's already hot, birdie.\"";G.msgT=999}
else if(shot==='shop'){G.corn=320;G.score=5100;G.screen='shop';G.upgrades={boots:true,magnet:true};G.cleared=[true,true,true,true,false,false,false];G.legScores=[820,1240,980,1420];G.saveSlots=[{corn:320,score:5100,cleared:[true,true,true,true,false,false,false],upgrades:{boots:true},legScores:[820,1240,980,1420],bestCombo:4},null,null]}
if(!shot){G.screen='title'}
/* ---------- test API ---------- */
window.__turkey={G,LEGS,UPGRADES,resetRun,buyUpgrade,saveSlot,loadSlot,featherBurst,gobble,hurt,completeLeg,caught,
 startLeg:n=>resetRun(n),setCorn:n=>{G.corn=n},setLives:n=>{G.lives=n}};
loop();
</script>
