/* ---------------- utils ---------------- */
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function pill(x, y, w, h, fill, stroke){
  rr(x, y, w, h, Math.min(14, h / 2));
  ctx.fillStyle = fill; ctx.fill();
  if (stroke){ ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 'bold') + ' ' + size + 'px Trebuchet MS, Verdana, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function txtShadow(s, x, y, size, color, align, weight){
  ctx.font = (weight || 'bold') + ' ' + size + 'px Trebuchet MS, Verdana, sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(40,16,0,0.85)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function heart(x, y, s, fill){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-11, -4, -6, -12, 0, -5);
  ctx.bezierCurveTo(6, -12, 11, -4, 0, 6);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#7a1020'; ctx.stroke();
  ctx.restore();
}
function star(x, y, r, fill){
  ctx.save(); ctx.translate(x, y); ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#8a5a00'; ctx.stroke(); ctx.restore();
}

function freshSave(){
  return { corn: 0, legsCleared: [], upgrades: {}, best: {}, totalScore: 0, feats: [] };
}
const G = {
  screen: 'title',
  leg: 1, score: 0, corn: 0, lives: 3, combo: 1, bestCombo: 1, dist: 0,
  upgrades: {}, cleared: [], legScores: {}, feats: [], saveSlot: 0,
  saves: [null, null, null],

function loadSaves(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){ const arr = JSON.parse(raw); if (Array.isArray(arr)) G.saves = arr.slice(0, 3); }
  } catch (e){ /* storage unavailable: keep in-memory saves */ }
  while (G.saves.length < 3) G.saves.push(null);
}
function persistSaves(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.saves)); } catch (e){ /* ignore */ }
}
loadSaves();
function saveGame(slot){
  const snap = { corn: G.corn, legsCleared: G.cleared.slice(), upgrades: Object.assign({}, G.upgrades),
    best: Object.assign({}, G.legScores), totalScore: G.score, feats: G.feats.slice(), when: Date.now() };
  G.saves[slot] = snap; persistSaves(); G.saveSlot = slot;
  return snap;
}
function loadGame(slot){
  const s = G.saves[slot];
  if (!s) return false;
  G.corn = s.corn; G.cleared = (s.legsCleared || []).slice();
  G.upgrades = Object.assign({}, s.upgrades || {});
  G.legScores = Object.assign({}, s.best || {});
  G.score = s.totalScore || 0; G.feats = (s.feats || []).slice();
  G.saveSlot = slot; return true;
}
function gradeFor(score, corn, hits){
  if (score >= 2600 && hits === 0) return 'S';
  if (score >= 1800) return 'A';
  if (score >= 1100) return 'B';
  return 'C';
}

/* ---------------- audio (WebAudio synth, no files) ---------------- */
let AC = null;
function audio(){
  if (G.muted) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e){ return null; }
}
function tone(freq, dur, type, vol, slide){
  const ac = audio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e){ /* headless: ignore */ }
}
function sfx(name){
  if (name === 'gobble'){ tone(300, 0.09, 'square', 0.10); setTimeout(function(){ tone(240, 0.12, 'square', 0.10); }, 90); }
  else if (name === 'coin'){ tone(880, 0.08, 'sine', 0.10); setTimeout(function(){ tone(1320, 0.12, 'sine', 0.10); }, 70); }
  else if (name === 'jump'){ tone(280, 0.16, 'sine', 0.10, 560); }
  else if (name === 'hit'){ tone(160, 0.25, 'sawtooth', 0.14, 60); }
  else if (name === 'burst'){ tone(500, 0.3, 'triangle', 0.12, 1200); }
  else if (name === 'stun'){ tone(660, 0.1, 'square', 0.09); setTimeout(function(){ tone(660, 0.1, 'square', 0.09); }, 120); }
  else if (name === 'win'){ [523, 659, 784, 1046].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.22, 'triangle', 0.12); }, i * 130); }); }
  else if (name === 'click'){ tone(700, 0.05, 'square', 0.07); }
  else if (name === 'hiss'){ tone(1200, 0.4, 'sawtooth', 0.04, 900); }
  else if (name === 'swish'){ tone(900, 0.14, 'sawtooth', 0.08, 300); }
}
let themeTimer = null;
function startTheme(){
  if (themeTimer) return;
  const notes = [523, 587, 659, 784, 659, 587, 523, 392];
  let i = 0;
  themeTimer = setInterval(function(){
    if (G.muted || (G.screen !== 'title' && G.screen !== 'map')) return;
    tone(notes[i % notes.length], 0.22, 'triangle', 0.05);
    i++;
  }, 260);
}

/* ---------------- sprites (drawn canvas paths, no emoji, no flat-rect characters) ---------------- */
function drawTurkey(x, y, s, opts){
  opts = opts || {};
  const run = opts.run || 0, flip = opts.flip ? -1 : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * flip, s);
  // tail fan
  ctx.fillStyle = '#7a4a1e';
  for (let i = -2; i <= 2; i++){
    ctx.save(); ctx.rotate(i * 0.32);
    ctx.beginPath(); ctx.ellipse(0, -26, 7, 24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#a86a2e';
  for (let i = -2; i <= 2; i++){
    ctx.save(); ctx.rotate(i * 0.32);
    ctx.beginPath(); ctx.ellipse(0, -24, 4.5, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // body
  ctx.fillStyle = '#8a5a2e';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a86a2e';
  ctx.beginPath(); ctx.ellipse(-4, 4, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
  // wing
  ctx.fillStyle = '#6b4423';
  ctx.beginPath(); ctx.ellipse(-6, -2, 14, 9, -0.4 + Math.sin(run) * 0.25, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.strokeStyle = '#e8a020'; ctx.lineWidth = 3;
  const lp = Math.sin(run) * 6;
  ctx.beginPath(); ctx.moveTo(-8, 18); ctx.lineTo(-8 + lp, 30); ctx.moveTo(8, 18); ctx.lineTo(8 - lp, 30); ctx.stroke();
  // neck + head
  ctx.fillStyle = '#8a5a2e';
  ctx.beginPath(); ctx.ellipse(18, -22, 8, 16, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c06040';
  ctx.beginPath(); ctx.arc(22, -36, 10, 0, Math.PI * 2); ctx.fill();
  // wattle + snood
  ctx.fillStyle = '#d02030';
  ctx.beginPath(); ctx.ellipse(26, -28, 3.5, 6, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(30, -38, 2.5, 5, 0.5, 0, Math.PI * 2); ctx.fill();
  // beak
  ctx.fillStyle = '#e8a020';
  ctx.beginPath(); ctx.moveTo(30, -38); ctx.lineTo(40, -34); ctx.lineTo(30, -31); ctx.closePath(); ctx.fill();
  // eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(24, -39, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(25, -39, 1.7, 0, Math.PI * 2); ctx.fill();
  if (opts.decoy){
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(0, -6, 40, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawFarmer(x, y, s, opts){
  opts = opts || {};
  const run = opts.run || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // legs + boots
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 7;
  const lp = Math.sin(run) * 8;
  ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-6 + lp, 34); ctx.moveTo(6, 8); ctx.lineTo(6 - lp, 34); ctx.stroke();
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(-14 + lp, 30, 14, 8); ctx.fillRect(2 - lp, 30, 14, 8);
  // overalls body
  ctx.fillStyle = '#3a5a8a';
  rr(-16, -22, 32, 34, 8); ctx.fill();
  ctx.fillStyle = '#c03030';
  ctx.fillRect(-16, -22, 32, 10);
  // arms reaching forward
  ctx.strokeStyle = '#e8b890'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(12, -14); ctx.lineTo(30, -6 + Math.sin(run) * 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(28, 4); ctx.stroke();
  // head + hat
  ctx.fillStyle = '#e8b890'; ctx.beginPath(); ctx.arc(0, -32, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8a020';
  ctx.beginPath(); ctx.ellipse(0, -42, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-10, -56, 20, 14);
  // beard + angry eyes
  ctx.fillStyle = '#8a6a4a';
  ctx.beginPath(); ctx.ellipse(0, -24, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(5, -34, 1.8, 0, Math.PI * 2); ctx.arc(11, -34, 1.8, 0, Math.PI * 2); ctx.fill();
  if (opts.stun){
    star(-14, -52, 7, '#ffd23e'); star(14, -56, 6, '#ffd23e'); star(0, -62, 5, '#fff');
  }
  ctx.restore();
}

function drawCook(x, y, s, opts){
  opts = opts || {};
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // dress + apron
  ctx.fillStyle = '#7a4a6a';

function drawHen(x, y, s, body, head, name){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = head;
  ctx.beginPath(); ctx.arc(14, -14, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d02030';
  ctx.beginPath(); ctx.ellipse(14, -22, 4, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8a020';
  ctx.beginPath(); ctx.moveTo(21, -15); ctx.lineTo(28, -12); ctx.lineTo(21, -10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(16, -16, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e8a020'; ctx.lineWidth = 2.5;

/* A frozen, fully-packed run state for staged shots (deterministic, seeded). */
function stagedRun(){
  const leg = LEGS[G.leg - 1];
  const rng = mulberry32(20261127 + G.leg * 131);
  const pickups = [];
  const kinds = ['corn', 'seed', 'acorn', 'berry', 'apple', 'crumb', 'sun', 'clover', 'feather', 'gold', 'corn', 'maple', 'corn', 'berry', 'apple', 'sun'];
  for (let i = 0; i < 16; i++){
    pickups.push({ x: 150 + i * 72 + rng() * 24, y: (i % 2 === 0 ? 540 : 486) + rng() * 12, k: kinds[i % kinds.length], taken: false });
  }
  const hazards = [];
  if (leg.n === 2){
    hazards.push({ k:'fence', x: 900 }, { k:'hay', x: 1060 }, { k:'trap', x: 700 }, { k:'knife', x: 1120 }, { k:'pitchfork', x: 300 });
  } else if (leg.n === 4){
    hazards.push({ k:'oven', x: 760 }, { k:'hay', x: 620 }, { k:'knife', x: 880 }, { k:'trap', x: 420 }, { k:'fence', x: 180 });
  } else {
    hazards.push({ k:'fence', x: 820 }, { k:'hay', x: 1020 }, { k:'trap', x: 620 }, { k:'knife', x: 1140 });
  }
  const cheer = [
    { kind:'hen', x: 180, y: 430, say:'Flap!' },
    { kind:'goose', x: 420, y: 430, say:'HONK!' },
    { kind:'pig', x: 980, y: 440, say:'Go Gobble!' },
    { kind:'duck', x: 1180, y: 436, say:'Run!' },
  ];
  const sayer = leg.n === 4 ? 'Marge' : leg.n === 6 ? 'Daffodil' : 'Henrietta';
  const say = leg.n === 4 ? '"The oven is already hot, birdie."' : leg.n === 6 ? '"Logs, not water, dear."' : '"Flap like you mean it!"';
  return { px: 480, py: 0, pickups: pickups, hazards: hazards, cheer: cheer, say: say, sayer: sayer,
    burstFx: (G.shotMode === 'play') ? 1 : 0, t: 0 };
}

/* ---------------- run simulation ---------------- */
function newRun(legN){
  const leg = LEGS[legN - 1];
  const rng = mulberry32(1234 + legN * 777);
  const pickups = [], hazards = [];
  const kinds = ['corn', 'seed', 'acorn', 'berry', 'apple', 'crumb', 'sun', 'clover', 'feather', 'gold', 'corn', 'maple', 'corn', 'berry'];
  for (let i = 0; i < 60; i++){
    pickups.push({ x: 500 + i * 90 + rng() * 40, y: 520 + (i % 3) * 26 - 46, k: kinds[i % kinds.length], taken: false, world: true });
  }
  const hzKinds = legN === 4 ? ['oven', 'hay', 'knife', 'trap', 'fence', 'pitchfork']
    : legN === 5 ? ['apple', 'hay', 'fence', 'trap', 'knife', 'mud']
    : legN === 6 ? ['log', 'mud', 'fence', 'trap', 'knife', 'hay']
    : ['fence', 'hay', 'trap', 'knife', 'pitchfork', 'wheel'];
  for (let i = 0; i < 22; i++){
    hazards.push({ x: 900 + i * 260 + rng() * 90, k: hzKinds[i % hzKinds.length], y: 500 + rng() * 40, world: true });
  }
  const cheer = [
    { kind:'hen', x: 200, y: 430, say:'Flap!' },
    { kind:'goose', x: 460, y: 430, say:'HONK!' },
    { kind:'pig', x: 980, y: 440, say:'Go Gobble!' },
    { kind:'duck', x: 1180, y: 436, say:'Run!' },
  ];
  const sayer = legN === 4 ? 'Marge' : legN === 6 ? 'Daffodil' : 'Henrietta';
  const say = legN === 4 ? '"The oven is already hot, birdie."' : legN === 6 ? '"Logs, not water, dear."' : '"Flap like you mean it!"';
  return { leg: legN, px: 480, py: 0, vy: 0, onGround: true, scroll: 0,
    pickups: pickups, hazards: hazards, cheer: cheer, say: say, sayer: sayer,
    burstFx: 0, hits: 0, legCorn: 0, legScore: 0, percyUsed: false, mapleFound: false };
}
function startLeg(n){
  G.leg = n;
  G.lives = 3 + (G.upgrades.clover ? 1 : 0);
  G.combo = 1; G.bestCombo = 1; G.dist = 0;
  G.burstMax = 2 + (G.upgrades.pouch ? 1 : 0);
  G.burst = G.burstMax; G.gobble = 1; G.hankDist = 120; G.hankStun = 0; G.biscuitBoost = 0;
  G.run = newRun(n);
  G.screen = 'play'; G.paused = false;
  const leg = LEGS[n - 1];
  G.banner = leg.event; G.bannerT = 3;
  sfx('gobble');
}
function collectPickup(p){
  const t = PICKUP_TYPES.find(function(x){ return x.k === p.k; }) || PICKUP_TYPES[0];
  let val = t.val;
  if (LEGS[G.leg - 1].event === 'RAIN SHOWER') val *= 2;
  G.corn += val; G.run.legCorn += val;
  G.combo = Math.min(5, G.combo + 1); G.bestCombo = Math.max(G.bestCombo, G.combo);
  const pts = 10 * val * G.combo;
  G.score += pts; G.run.legScore += pts;
  G.gobble = clamp(G.gobble + 0.08, 0, 1);
  if (G.burst < G.burstMax && G.corn % 12 === 0) G.burst++;
  sfx('coin');
}
function takeHit(reason){
  if (G.run.hits === 0 && G.upgrades.legs){ G.run.hits++; G.msg = 'Sturdy Legs saved you!'; G.msgT = 2; sfx('hit'); return; }
  G.lives--; G.run.hits++; G.combo = 1;
  G.hankDist = Math.max(20, G.hankDist - 40);
  sfx('hit');
  if (G.lives <= 0){
    G.caughtReason = reason || 'Hank caught up with you in the ' + LEGS[G.leg - 1].name + '.';
    G.screen = 'caught'; G.run = null;
  } else {
    G.msg = 'OUCH! ' + reason + ' — ' + G.lives + ' lives left'; G.msgT = 2;
  }
}
function doBurst(){
  if (G.burst <= 0 || G.screen !== 'play' || !G.run) return false;
  G.burst--; G.run.burstFx = 1.2;
  G.hankDist = Math.min(220, G.hankDist + 90);
  G.score += 50; G.run.legScore += 50;
  sfx('burst');
  return true;
}
function doGobble(){
  if (G.screen !== 'play' || !G.run) return false;
  if (G.gobble < 1){ G.msg = 'Gobble meter still filling...'; G.msgT = 1.5; return false; }
  G.gobble = 0;
  if (G.hankDist < 130){
    G.hankStun = G.upgrades.horn ? 4 : 2;
    G.score += 30; G.run.legScore += 30;
    sfx('stun');
  } else {
    G.biscuitBoost = 3;
    G.msg = 'Mistimed gobble! Biscuit heard you — he runs faster!'; G.msgT = 2;
    sfx('gobble');
  }
  return true;
}
function doJump(){
  if (G.screen !== 'play' || !G.run || !G.run.onGround) return false;
  G.run.vy = -11; G.run.onGround = false; sfx('jump'); return true;
}
function finishLeg(){
  const run = G.run;
  const legScore = run ? run.legScore + 400 : 400;
  const legCorn = run ? run.legCorn : 0;
  const hits = run ? run.hits : 0;
  G.score += 400;
  const grade = gradeFor(legScore, legCorn, hits);
  if (G.cleared.indexOf(G.leg) < 0) G.cleared.push(G.leg);
  G.legScores[G.leg] = Math.max(G.legScores[G.leg] || 0, legScore);
  if (G.feats.indexOf('Leg ' + G.leg + ' cleared') < 0) G.feats.push('Leg ' + G.leg + ' cleared');
  if (hits === 0 && G.feats.indexOf('Clean run leg ' + G.leg) < 0) G.feats.push('Clean run leg ' + G.leg);
  G.results = { leg: G.leg, score: legScore, corn: legCorn, grade: grade, bestCombo: G.bestCombo, hits: hits };
  G.run = null;
  if (G.leg >= 7){
    G.escapedGrade = grade;
    G.screen = 'escaped';
  } else {
    G.screen = 'results';
  }
  sfx('win');
}
function update(dt){
  if (G.screen !== 'play' || !G.run || G.paused) return;
  const leg = LEGS[G.leg - 1];
  const run = G.run;
  const speed = 260 * (G.upgrades.boots ? 1.2 : 1);
  run.scroll += speed * dt;
  G.dist += speed * dt / 10;
  G.score += Math.floor(speed * dt / 20);
  run.legScore += Math.floor(speed * dt / 20);
  // gravity / jump
  if (!run.onGround){
    run.vy += 30 * dt; run.py += run.vy;
    if (run.py >= 0){ run.py = 0; run.onGround = true; }
  }
  // Hank chase
  const hankSpeed = (G.hankStun > 0) ? 0 : (leg.event === 'FEED-TIME RUSH' ? 26 : 13) * (G.upgrades.steps ? 0.7 : 1) + G.biscuitBoost * 10;
  if (G.hankStun > 0) G.hankStun -= dt;
  if (G.biscuitBoost > 0) G.biscuitBoost -= dt;
  G.hankDist = clamp(G.hankDist - hankSpeed * dt + 6 * dt, 18, 220);
  // Percy blocks Hank once per leg
  if (!run.percyUsed && G.hankDist < 30){
    run.percyUsed = true; G.hankDist = 120;
    G.msg = 'Percy "accidentally" blocks Hank!'; G.msgT = 2;
  }
  if (G.hankDist <= 18){ takeHit('Hank grabbed your tail feathers'); return; }
  if (run.burstFx > 0) run.burstFx -= dt;
  // pickups: world x -> screen x
  const magnetR = G.upgrades.magnet ? 120 : 55;
  run.pickups.forEach(function(p){
    const sx = p.x - run.scroll;
    if (sx < -40 || sx > W + 40 || p.taken) return;
    const dx = Math.abs(sx - run.px), dy = Math.abs((p.y - 40) - (520 - run.py));
    if (dx < magnetR && dy < 70){ p.taken = true; collectPickup(p); }
  });
  // hazards
  run.hazards.forEach(function(hz){
    const sx = hz.x - run.scroll;
    if (sx < -80 || sx > W + 80 || hz.hit) return;
    const dx = Math.abs(sx - run.px);
    const air = run.py > 40;
    if (dx < 34){
      if (hz.k === 'fence' || hz.k === 'log'){
        if (!air){ hz.hit = true; takeHit('Tripped on a ' + hz.k); }
      } else if (hz.k === 'oven'){
        if (!G.upgrades.scarf){ hz.hit = true; takeHit('The oven heat singed you'); }
      } else if (hz.k === 'apple'){
        if (!air){ hz.hit = true; takeHit('Bonked by a falling apple'); }
      } else {
        if (!air){ hz.hit = true; takeHit('Hit a ' + hz.k); }
      }
      if (G.screen !== 'play') return;
    }
  });
  // leg end
  if (G.dist >= leg.len){ finishLeg(); return; }
  if (G.msgT > 0) G.msgT -= dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  G.gobble = clamp(G.gobble + dt * 0.12, 0, 1);
}

/* ---------------- actions (keyboard + mouse) ---------------- */
function doAction(a){
  if (a === 'start'){ startLeg(G.leg); return; }
  if (a === 'map'){ G.screen = 'map'; G.run = null; G.paused = false; return; }
  if (a === 'shop'){ G.screen = 'shop'; return; }
  if (a === 'jump'){ doJump(); return; }
  if (a === 'gobble'){ doGobble(); return; }
  if (a === 'burst'){ doBurst(); return; }
  if (a === 'retry'){ startLeg(G.leg); return; }
  if (a === 'restart'){ G.cleared = []; G.legScores = {}; G.score = 0; G.corn = 0; G.feats = []; G.leg = 1; startLeg(1); return; }
  if (a === 'nextleg'){
    if (G.results && G.results.leg < 7){ G.leg = G.results.leg + 1; startLeg(G.leg); }
    else { G.screen = 'escaped'; }
    return;
  }
  if (a === 'save0'){ saveGame(0); G.msg = 'Saved to slot 1!'; G.msgT = 2; sfx('click'); return; }
  if (a.indexOf('leg') === 0){ const n = parseInt(a.slice(3), 10); if (n >= 1 && n <= 7){ G.leg = n; startLeg(n); } return; }
  if (a.indexOf('load') === 0){
    const slot = parseInt(a.slice(4), 10);
    if (loadGame(slot)){ G.screen = 'map'; sfx('click'); }
    return;
  }
  if (a.indexOf('buy') === 0){
    const u = UPGRADES[parseInt(a.slice(3), 10)];
    if (!u) return;
    if (G.upgrades[u.id]){ G.msg = u.name + ' already owned'; G.msgT = 1.5; return; }
    if (G.corn < u.price){ G.msg = 'Not enough corn for ' + u.name + ' (' + u.price + ')'; G.msgT = 2; return; }
    G.corn -= u.price; G.upgrades[u.id] = true; sfx('coin');
    G.msg = 'Bought ' + u.name + '!'; G.msgT = 2;
    return;
  }
}
window.addEventListener('keydown', function(e){
  const k = e.key;
  if (k === 'm' || k === 'M'){ G.muted = !G.muted; return; }
  if (k === 'p' || k === 'P'){ if (G.screen === 'play') G.paused = !G.paused; return; }
  if (k === 'Enter'){
    if (G.screen === 'title' || G.screen === 'map') doAction('start');
    else if (G.screen === 'results') doAction('nextleg');
    else if (G.screen === 'caught') doAction('retry');
    else if (G.screen === 'escaped') doAction('restart');
    return;
  }
  if (G.screen === 'play'){
    if (k === 'ArrowUp' || k === 'w' || k === 'W') doJump();
    else if (k === ' '){ e.preventDefault(); doGobble(); }
    else if (k === 'Shift'){ doBurst(); }
    else if (k === 'Escape'){ G.paused = !G.paused; }
  }
});
cv.addEventListener('click', function(e){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  for (let i = clickables.length - 1; i >= 0; i--){
    const c = clickables[i];
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h){ sfx('click'); doAction(c.action); return; }
  }
});

/* ---------------- render + loop ---------------- */
function render(){
  clickables = [];
  ctx.clearRect(0, 0, W, H);
  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'map') drawMap();
  else if (G.screen === 'shop') drawShop();
  else if (G.screen === 'play') drawPlay();
  else if (G.screen === 'results') drawResults();
  else if (G.screen === 'caught') drawCaught();
  else if (G.screen === 'escaped') drawEscaped();
  // transient message toast (on-canvas, inside margins)
  if (G.msgT > 0 && G.msg){
    pill(340, 640, 600, 36, 'rgba(30,16,4,0.9)', '#ffd23e');
    txt(G.msg, 640, 658, 14, '#fff', 'center');
  }
}
let lastT = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  G.time += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- ?shot= staging (deterministic) ---------------- */
function applyShot(){
  const q = new URLSearchParams(window.location.search);
  const shot = q.get('shot');
  if (!shot) return false;
  G.shotMode = shot;
  G.time = 1.2;
  if (shot === 'play'){
    G.leg = 2; G.score = 1840; G.corn = 87; G.lives = 3; G.combo = 4; G.bestCombo = 5;
    G.dist = 420; G.burst = 1; G.burstMax = 2; G.gobble = 0.7; G.hankDist = 64;
    G.cleared = [1]; G.screen = 'play'; G.run = null;
  } else if (shot === 'title'){
    G.corn = 87; G.cleared = [1]; G.screen = 'title';
  } else if (shot === 'barn'){
    G.leg = 4; G.score = 2310; G.corn = 124; G.lives = 2; G.combo = 3; G.bestCombo = 5;
    G.dist = 380; G.burst = 2; G.burstMax = 3; G.gobble = 0.4; G.hankDist = 48;
    G.cleared = [1, 2, 3]; G.upgrades = { boots: true, pouch: true }; G.screen = 'play'; G.run = null;
  } else if (shot === 'shop'){
    G.corn = 214; G.cleared = [1, 2]; G.leg = 3; G.score = 3120;
    G.upgrades = { boots: true, magnet: true };
    G.legScores = { 1: 1420, 2: 1700 };
    G.saves[0] = { corn: 214, legsCleared: [1, 2], upgrades: { boots: true, magnet: true }, best: { 1: 1420, 2: 1700 }, totalScore: 3120, feats: ['Leg 1 cleared', 'Leg 2 cleared'], when: 1795740000000 };
    G.screen = 'shop';
  }
  render();
  window.__shotReady = true;
  return true;
}

/* ---------------- test / debug API (used by the headless playtest) ---------------- */
window.GOBBLE = {
  state: G, LEGS: LEGS, UPGRADES: UPGRADES,
  startLeg: startLeg, doAction: doAction, saveGame: saveGame, loadGame: loadGame,
  doJump: doJump, doGobble: doGobble, doBurst: doBurst, takeHit: takeHit,
  finishLeg: finishLeg,
  forceCaught: function(){
    G.lives = 1;
    if (!G.run) G.run = newRun(G.leg);
    G.screen = 'play';
    takeHit('Hank grabbed your tail feathers');
  },
  escapeLeg7: function(){
    G.leg = 7; G.cleared = [1, 2, 3, 4, 5, 6];
    G.run = newRun(7); G.screen = 'play';
    finishLeg();
  },
  shot: function(name){
    const u = new URL(window.location.href);
    u.searchParams.set('shot', name);
    window.location.href = u.toString();
  },
};

/* ---------------- boot ---------------- */
startTheme();
if (!applyShot()){
  render();
  requestAnimationFrame(loop);
}
</script>
