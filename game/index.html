/* ---------- PROFILE / SAVE ---------- */
function freshProfile(){ return { corn:0, legsCleared:[false,false,false,false,false,false,false],
  upgrades:{}, refits:[], scores:[0,0,0,0,0,0,0], bestCombo:0, totalCorn:0,
  rushesDone:{}, feats:{}, burstCount:0, slideCount:0, stuns:0, shopVisits:0 }; }
let profile = freshProfile();
let slot = 1;
function saveKey(s){ return 'gobble-save-' + s; }
function saveGame(s){ slot = s||slot; try{ localStorage.setItem(saveKey(slot), JSON.stringify(profile)); }catch(e){} return true; }
function loadGame(s){ slot = s||slot; try{ const raw = localStorage.getItem(saveKey(slot)); if(raw){ profile = JSON.parse(raw); return true; } }catch(e){} return false; }
function refitBonus(){ let pts=1, corn=1, spd=1, life=0, burst=1, combo=0;
  const sets = {};
  for(const id of profile.refits){ const c = REFITS.find(r=>r.id===id); if(!c) continue;
    if(c.pts) pts += c.pts; if(c.corn) corn += c.corn; if(c.spd) spd += c.spd;
    if(c.life) life += c.life; if(c.burst) burst = Math.max(burst, c.burst); if(c.combo) combo += c.combo;
    sets[c.set] = (sets[c.set]||0)+1; }
  const setLabels = [];
  for(const k in sets){ const b = SET_BONUS[k]; if(b && sets[k] >= b.n){ setLabels.push(b.label);
    if(b.pts) pts += b.pts; if(b.life) life += b.life; if(b.burst) burst = Math.max(burst, b.burst); } }
  return {pts, corn, spd, life, burst, combo, setLabels}; }
function hasUp(id){ return !!profile.upgrades[id]; }
function speedMul(){ let m = 1; if(hasUp('boots')) m *= 1.12; m *= refitBonus().spd; return m; }
function maxLives(){ let l = 3 + (hasUp('clover')?1:0) + refitBonus().life; return l; }

/* ---------- AUDIO (WebAudio synth, no files) ---------- */
let AC = null, muted = false, musicTimer = null, musicStep = 0;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol, slideTo){ const ac = audio(); if(!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type||'sine'; o.frequency.value = freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol||0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur); }
function sfx(name){ if(muted) return;
  if(name==='coin'){ beep(880,0.09,'square',0.08); setTimeout(()=>beep(1320,0.12,'square',0.08),70); }
  else if(name==='gobble'){ beep(300,0.12,'sawtooth',0.10,180); setTimeout(()=>beep(420,0.10,'sawtooth',0.10,260),110); }
  else if(name==='burst'){ beep(500,0.25,'triangle',0.14,1200); }
  else if(name==='hit'){ beep(160,0.25,'sawtooth',0.16,60); }
  else if(name==='jump'){ beep(320,0.14,'sine',0.10,640); }
  else if(name==='slide'){ beep(700,0.3,'sine',0.07,300); }
  else if(name==='stun'){ beep(1200,0.2,'square',0.08,400); }
  else if(name==='win'){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'triangle',0.12),i*130)); }
  else if(name==='lose'){ [400,340,280,180].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.10),i*150)); }
  else if(name==='honk'){ beep(220,0.16,'sawtooth',0.12,180); setTimeout(()=>beep(220,0.16,'sawtooth',0.12,180),180); }
  else if(name==='splash'){ beep(500,0.2,'sine',0.08,150); }
}
const THEME = [523,0,659,0,784,0,659,0, 880,0,784,0,659,0,587,0, 523,0,659,0,784,0,1046,0, 784,659,587,523,0,0,0,0];
function startMusic(){ stopMusic(); const ac = audio(); if(!ac) return;
  musicTimer = setInterval(()=>{ if(muted || !ac) return; const f = THEME[musicStep % THEME.length]; musicStep++;
    if(f) beep(f, 0.16, 'triangle', 0.045); }, 170); }
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }

/* ---------- DRAW HELPERS ---------- */
function pill(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,size,col,align,weight){ ctx.fillStyle = col||'#fff'; ctx.font = (weight||'bold')+' '+size+'px system-ui, sans-serif';
  ctx.textAlign = align||'left'; ctx.textBaseline = 'middle'; ctx.fillText(s,x,y); }
function darkPill(x,y,w,h){ ctx.fillStyle='rgba(40,20,8,0.78)'; pill(x,y,w,h,10); ctx.fill(); }
function heart(x,y,s,fill){ ctx.fillStyle = fill?'#e83a4e':'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.moveTo(x,y+s*0.35); ctx.bezierCurveTo(x-s,y-s*0.4,x-s*0.45,y-s*0.9,x,y-s*0.25);
  ctx.bezierCurveTo(x+s*0.45,y-s*0.9,x+s,y-s*0.4,x,y+s*0.35); ctx.fill(); }
function bubble(x,y,w,h,lines,size){ darkPill(x,y,w,h); ctx.fillStyle='#fff3d6'; pill(x+8,y+8,w-16,h-16,8); ctx.fill();
  ctx.fillStyle='#5a3410'; ctx.font='bold '+size+'px system-ui, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  lines.forEach((ln,i)=>ctx.fillText(ln, x+16, y+16 + i*(size+4) + size*0.4)); }
/* ---------- CHARACTER ART (every figure mid-action; t = animation phase) ---------- */
function drawGobble(x, y, s, t, opts){
  opts = opts || {}; const lean = opts.slide ? 0.55 : 0.38, run = Math.sin(t*10);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(lean*0.35);
  /* tail feathers streaming behind */
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for(let i=0;i<4;i++){ const a = -0.5 - i*0.22 + Math.sin(t*8+i)*0.06;
    ctx.beginPath(); ctx.moveTo(-14,-6); ctx.lineTo(-14 + Math.cos(a)*34, -6 + Math.sin(a)*34); ctx.stroke();
    ctx.fillStyle = i%2 ? '#c98a3a' : '#a86a24'; ctx.beginPath(); ctx.arc(-14 + Math.cos(a)*36, -6 + Math.sin(a)*36, 5, 0, 7); ctx.fill(); }
  /* legs in running stride */
  ctx.strokeStyle = '#e8a83c'; ctx.lineWidth = 5;
  const l1 = run*14, l2 = -run*14;
  ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-4 + l1, 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(6 + l2, 26); ctx.stroke();
  /* dust puffs at feet */
  ctx.fillStyle = 'rgba(220,190,140,0.85)';
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-10 - i*10 + Math.sin(t*9+i)*3, 24 - i*3, 5+i*1.5, 0, 7); ctx.fill(); }
  /* body leaning forward */
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 18, -0.25, 0, 7); ctx.fill();
  ctx.fillStyle = '#a86a24'; ctx.beginPath(); ctx.ellipse(-2, -4, 20, 13, -0.25, 0, 7); ctx.fill();
  /* wing tucked back, mid-flap */
  ctx.fillStyle = '#5a3410'; ctx.beginPath(); ctx.ellipse(-8, -2, 16, 8, -0.7 + Math.sin(t*10)*0.15, 0, 7); ctx.fill();
  /* neck + head thrust forward */
  ctx.fillStyle = '#8a5a2a'; ctx.beginPath(); ctx.ellipse(22, -18, 7, 12, 0.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#a86a24'; ctx.beginPath(); ctx.arc(28, -28, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8a83c'; ctx.beginPath(); ctx.moveTo(36,-30); ctx.lineTo(48,-26); ctx.lineTo(36,-22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d9382b'; ctx.beginPath(); ctx.arc(30,-18, 3.5, 0, 7); ctx.fill(); /* wattle */
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(30,-31, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(31,-31, 1.6, 0, 7); ctx.fill();
  /* red head crest */
  ctx.fillStyle = '#d9382b'; ctx.beginPath(); ctx.arc(26,-38, 4, 0, 7); ctx.fill();
  if(opts.burst){ /* feather explosion around him */
    for(let i=0;i<10;i++){ const a = i/10*Math.PI*2 + t; const r = 34 + (t*40)%22;
      ctx.fillStyle = i%2 ? '#fff3d6' : '#c98a3a';
      ctx.beginPath(); ctx.ellipse(0 + Math.cos(a)*r, -8 + Math.sin(a)*r*0.7, 6, 3, a, 0, 7); ctx.fill(); } }
  ctx.restore();
  /* speed lines */
  if(opts.speed){ ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x-46-i*14, y-24+i*12); ctx.lineTo(x-70-i*14, y-24+i*12); ctx.stroke(); } }
}
function drawDecoy(x, y, s, t){
  ctx.save(); ctx.globalAlpha = 0.55; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#d9c9a8'; ctx.beginPath(); ctx.ellipse(0,0,24,16,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(24,-24,9,0,7); ctx.fill();
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2 + t*2;
    ctx.fillStyle='#fff3d6'; ctx.beginPath(); ctx.ellipse(Math.cos(a)*30, Math.sin(a)*22, 6, 3, a, 0, 7); ctx.fill(); }
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,40 + (t*30)%14, 0, 7); ctx.stroke();
  ctx.restore();
}
function drawHank(x, y, s, t, stunned){
  const run = Math.sin(t*9);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  /* motion lines behind boots */
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=3;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-30-i*12, 34+i*8); ctx.lineTo(-48-i*12, 34+i*8); ctx.stroke(); }
  /* legs: one driving forward, one pushing off */
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4, 10); ctx.lineTo(-4 + run*12, 38); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 10); ctx.lineTo(8 - run*12, 38); ctx.stroke();
  /* boots */
  ctx.fillStyle='#5a3410';
  ctx.beginPath(); ctx.ellipse(-4 + run*12, 40, 9, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8 - run*12, 40, 9, 5, 0, 0, 7); ctx.fill();
  /* overalls body leaning forward, mid-lunge */
  ctx.fillStyle='#2a4a7a'; ctx.beginPath(); ctx.ellipse(0, -6, 17, 24, 0.3, 0, 7); ctx.fill();
  ctx.fillStyle='#c94f3a'; ctx.beginPath(); ctx.ellipse(0, -22, 15, 11, 0.3, 0, 7); ctx.fill(); /* shirt */
  /* reaching arm forward, fingers spread */
  ctx.strokeStyle='#e8b88a'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(10, -26); ctx.lineTo(34, -34); ctx.stroke();
  ctx.fillStyle='#e8b88a';
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(36 + i*2, -40 + i*3, 2.2, 0, 7); ctx.fill(); }
  /* pumping arm back */
  ctx.strokeStyle='#e8b88a'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(-10, -24); ctx.lineTo(-28, -6 + run*6); ctx.stroke();
  /* head + hat sliding off */

function startLeg(i){
  legIdx = i; seed = 20261128 + i*7919 + (profile.legsCleared.filter(Boolean).length)*13;
  const r = rng(); const L = LEGS[i];
  const pickups = [], hazards = [], gravy = [];
  /* 30+ pickups spread through the leg */
  const nPick = 34 + i*2;
  for(let k=0;k<nPick;k++){ const d = 180 + k*(legTarget(i)-360)/nPick + r()*60;
    const type = L.pickups[Math.floor(r()*L.pickups.length)];
    pickups.push({d, type, y: 320 + r()*160, got:false}); }
  /* 8+ hazards */
  const nHaz = 9 + i;
  for(let k=0;k<nHaz;k++){ const d = 420 + k*(legTarget(i)-560)/nHaz + r()*80;
    const type = L.hazards[Math.floor(r()*L.hazards.length)];
    hazards.push({d, type, hit:false}); }
  /* gravy puddles — the Gravy Slide mechanic lives on every leg, more on leg 4 */
  const nG = (i===3 ? 7 : 4) + Math.floor(r()*2);
  for(let k=0;k<nG;k++){ const d = 500 + k*(legTarget(i)-700)/nG + r()*90; gravy.push({d, w: 120 + r()*80}); }
  R = { leg:i, dist:0, target:legTarget(i), score:0, cornRun:0, lives:maxLives(),
    combo:0, bestCombo:0, comboT:0, speed: 300*speedMul(), y:0, vy:0, ground: true,
    sliding:false, slideT:0, burst: 1 + (hasUp('pouch')?1:0), burstMax: 1 + (hasUp('pouch')?1:0),
    burstT:0, stunT:0, hankGap: 190, hankSpd: 1, rainT:0, floodT:0, stampedeT:0,
    pickups, hazards, gravy, parts:[], helpers:[], eventFired:{}, helpersShown:0,
    decoy:null, knifeWarn:0, extraHit: hasUp('legs'), t:0, done:false, caught:false };

  L.helpers.forEach((h, k)=>{ R.helpers.push({name:h, d: 500 + k*520, y: 210 + (k%2)*90}); });

  startMusic();
}
function fireEvent(id){
  const ev = EVENTS.find(e=>e.id===id); if(!ev || !R || R.eventFired[id]) return;

  eventBanner = ev; eventT = 3.2; sfx(id==='stampede'||id==='gravy' ? 'honk' : 'gobble');

  if(p > 0.88 && R.leg===0) fireEvent('fest');
}
function addScore(n){ const mult = 1 + (R.combo>=10?4:R.combo>=6?3:R.combo>=3?2:R.combo>=1?1:0);
  R.score += Math.round(n * mult * refitBonus().pts); }
function loseLife(why){
  if(R.extraHit){ R.extraHit = false; toast = 'Sturdy Legs saved you!'; toastT = 2; sfx('hit'); return; }
  R.lives--; R.combo = 0; sfx('hit'); R.parts.push({x:300, y:380, vx:-40, vy:-120, life:0.6, col:'#e83a4e', r:6});
  toast = 'Ouch! ' + why; toastT = 2;
  if(R.lives <= 0){ R.caught = true; finishCaught(); }
}
function updateRun(dt){
  if(!R || paused) return;
  R.t += dt;
  /* gravity + jump */
  if(!R.ground){ R.vy += 1900*dt; R.y += R.vy*dt; if(R.y >= 0){ R.y = 0; R.vy = 0; R.ground = true; } }
  /* gravy slide: on a puddle -> slide fast, cannot steer */
  let onGravy = false;
  for(const g of R.gravy){ if(Math.abs(R.dist - g.d) < g.w/2 && R.ground){ onGravy = true; break; } }
  if(onGravy && !R.sliding){ R.sliding = true; R.slideT = 1.2; profile.slideCount++; sfx('slide');
    R.parts.push({x:300, y:470, vx:-120, vy:-60, life:0.5, col:'#b07828', r:7}); }
  if(R.sliding){ R.slideT -= dt; if(R.slideT <= 0) R.sliding = false; }
  const slideBoost = R.sliding ? 1.6 : 1;
  const rainSlow = R.rainT > 0 ? 0.92 : 1;
  R.speed = 300 * speedMul() * slideBoost * rainSlow;
  if(R.burstT > 0){ R.speed *= 1.9; R.burstT -= dt; }
  R.dist += R.speed * dt;
  if(R.rainT > 0) R.rainT -= dt;
  if(R.floodT > 0) R.floodT -= dt;
  if(R.stampedeT > 0) R.stampedeT -= dt;
  /* combo decay */
  if(R.comboT > 0){ R.comboT -= dt; if(R.comboT <= 0) R.combo = 0; }
  /* burst meter refills from corn */
  if(R.burst < R.burstMax){ R.burst += dt * 0.12 * refitBonus().burst; if(R.burst > R.burstMax) R.burst = R.burstMax; }
  /* farmer proximity */
  const hankBase = (hasUp('quiet') ? 0.85 : 1) * R.hankSpd;
  if(R.stunT > 0){ R.stunT -= dt; R.hankGap += 60*dt; }
  else { R.hankGap -= (R.speed*0.06 - 14) * hankBase * dt; if(R.burstT>0) R.hankGap += 90*dt; }
  R.hankGap = clamp(R.hankGap, 60, 420);
  if(R.hankGap <= 62 && R.stunT <= 0){ loseLife('Hank grabbed your tail!'); R.hankGap = 200; }
  /* pickups */
  const magnet = hasUp('magnet') ? 90 : 56;
  for(const p of R.pickups){ if(p.got) continue;
    const px = 300 + (p.d - R.dist);
    if(Math.abs(px - 300) < magnet && Math.abs(p.y - (470 + R.y)) < 70){
      p.got = true; const def = PICKUP_DEFS[p.type];
      const cornGain = Math.round(def.corn * refitBonus().corn * (R.rainT>0 ? 2 : 1));
      R.cornRun += cornGain; R.combo++; R.comboT = 2.2 + refitBonus().combo;
      if(R.combo > R.bestCombo) R.bestCombo = R.combo;
      addScore(def.pts); sfx('coin');
      R.parts.push({x:px, y:p.y, vx:20, vy:-80, life:0.5, col:def.col, r:5});
      if(p.type==='feather' && R.burst < R.burstMax) R.burst = Math.min(R.burstMax, R.burst + 0.5);
    } }
  /* hazards */
  for(const h of R.hazards){ if(h.hit) continue;
    const hx = 300 + (h.d - R.dist);
    if(Math.abs(hx - 300) < 42 && R.ground && !R.sliding){
      if(h.type==='oven' && hasUp('scarf')){ h.hit = true; toast='Warm Scarf blocked the oven heat!'; toastT=2; continue; }
      h.hit = true; loseLife('Hit the ' + HAZARD_DEFS[h.type].label + '!');
    } }
  /* gravy flood: ground itself is a hazard unless sliding or airborne */
  if(R.floodT > 0 && R.ground && !R.sliding && Math.random() < dt*0.9){ loseLife('The gravy flood swept you!'); }
  /* stampede herd: animals crossing — dodge by jumping */
  if(R.stampedeT > 0 && R.ground && Math.random() < dt*0.5){ loseLife('Caught in the stampede!'); }
  maybeEvents();
  /* particles */
  for(const pt of R.parts){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += 300*dt; pt.life -= dt; }
  R.parts = R.parts.filter(p=>p.life>0);
  if(R.decoy){ R.decoy.life -= dt; if(R.decoy.life<=0) R.decoy = null; }
  if(R.dist >= R.target && !R.done){ finishLeg(); }
}
function doJump(){ if(!R || !R.ground || R.sliding) return; R.vy = -720; R.ground = false; sfx('jump'); }
function doBurst(){ if(!R || R.burst < 1 || R.burstT > 0) return;
  R.burst -= 1; R.burstT = 1.1; profile.burstCount++; sfx('burst');
  R.decoy = {x: 300 - 90, y: 470, life: 1.6}; R.hankGap += 70;
  for(let i=0;i<12;i++){ R.parts.push({x:300, y:440, vx:(Math.random()-0.5)*260, vy:-Math.random()*220, life:0.8, col: i%2?'#fff3d6':'#c98a3a', r:5}); } }
function doGobble(){ if(!R) return; sfx('gobble');
  if(R.hankGap < 260){ R.stunT = 2 + (hasUp('horn')?2:0); profile.stuns++; sfx('stun'); toast='GOBBLE STUN! Hank is frozen!'; toastT=1.6; }
  else { toast='Too far — Biscuit heard that! He runs faster!'; toastT=1.6; R.hankSpd = Math.min(R.hankSpd*1.3, 2.2); } }
function gradeFor(score, lives, bestCombo){
  if(score >= 5200 && lives >= 3) return 'S';
  if(score >= 3800) return 'A';
  if(score >= 2400) return 'B';
  return 'C';
}
function finishLeg(){
  R.done = true;
  const g = gradeFor(R.score, R.lives, R.bestCombo);
  lastGrade = g; lastScore = R.score; lastCorn = R.cornRun;
  profile.corn += R.cornRun; profile.totalCorn += R.cornRun;
  profile.legsCleared[R.leg] = true; profile.scores[R.leg] = R.score;
  if(R.bestCombo > profile.bestCombo) profile.bestCombo = R.bestCombo;
  if(R.lives === maxLives()) profile.feats['No life lost'] = true;
  if(R.cornRun >= 60) profile.feats['Corn hoarder (60+ in a leg)'] = true;
  if(profile.slideCount >= 3) profile.feats['Gravy Slide rider'] = true;
  if(profile.burstCount >= 5) profile.feats['Feather Burst ace'] = true;
  if(profile.legsCleared.every(Boolean)) profile.feats['All 7 legs'] = true;
  if(profile.totalCorn >= 5000) profile.feats['5,000 corn'] = true;
  if(Object.keys(profile.rushesDone).length >= 6) profile.feats['Survived all 6 rushes'] = true;
  runLog.push({leg:R.leg, score:R.score, grade:g, corn:R.cornRun});
  sfx('win');
  if(R.leg === 6){ screen = 'escaped'; }
  else { screen = 'results'; }
  stopMusic();
}
function finishCaught(){ sfx('lose'); screen = 'caught'; stopMusic(); }
function openShop(){
  profile.shopVisits++;

  const r = rng(); const pool = REFITS.slice();
  shopOffer = [];

function drawPlay(t){
  drawBackground(R.leg, R.dist, t);
  const L = LEGS[R.leg];
  /* gravy puddles on the ground */
  for(const g of R.gravy){ const gx = 300 + (g.d - R.dist);
    if(gx > -120 && gx < W+120) drawGravyPuddle(gx, GROUND_Y + 6, g.w, t); }
  /* helpers cheering from the fences, mid-action, with speech */
  for(const h of R.helpers){ const hx = 300 + (h.d - R.dist);
    if(hx > -60 && hx < W+60){ drawHelperFigure(h.name, hx, h.y, 0.75, t);
      const c = CAST[h.name==='Auntie Maple' ? 'Maple' : h.name];
      if(c && hx > 200 && hx < 900 && h.y - 78 >= 160){ const line = c.line.slice(0, 30);
        const bw = 24 + line.length*7.2;
        darkPill(hx-bw/2, h.y-78, bw, 30);
        txt(line, hx, h.y-62, 11, '#fff3d6', 'center'); } } }
  /* pickups */
  for(const p of R.pickups){ if(p.got) continue; const px = 300 + (p.d - R.dist);
    if(px > -30 && px < W+30){ ctx.save(); ctx.translate(px, p.y); drawPickup(p, t); ctx.restore(); } }
  /* hazards */
  for(const h of R.hazards){ const hx = 300 + (h.d - R.dist);
    if(hx > -80 && hx < W+80){ ctx.save(); ctx.translate(hx, 0); drawHazard(h, t); ctx.restore(); } }
  /* stampede herd running across when the rush is live */
  if(R.stampedeT > 0){ const herd = ['Percy','Henrietta','Gus','Waffles','Bramble'];
    herd.forEach((n, i)=>{ const hx = ((t*420 + i*190) % 1500) - 100;
      drawHelperFigure(n, hx, 430 + (i%2)*40, 0.9, t); }); }
  /* Biscuit leaping (leg 5+) */
  if(R.leg >= 4){ drawBiscuit(300 - R.hankGap + 70, 452 - Math.abs(Math.sin(t*4))*14, 0.95, t); }
  /* Hank lunging behind */
  drawHank(300 - R.hankGap, 452, 1.15, t, R.stunT > 0);
  /* feather decoy */
  if(R.decoy) drawDecoy(R.decoy.x, R.decoy.y, 1, t);
  /* Gobble — sprinting, or sliding on gravy */
  if(R.sliding){ /* slide pose: low, feet forward, slide lines + splashes */
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(300-60-i*16, 492+i*6); ctx.lineTo(300-90-i*16, 492+i*6); ctx.stroke(); }
    ctx.fillStyle='rgba(176,120,40,0.9)';
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(290 - i*12, 488 - (i%2)*8, 4, 0, 7); ctx.fill(); }
    drawGobble(300, 478 + R.y, 1.15, t, {slide:true, speed:true});
    darkPill(560, 380, 170, 30); txt('GRAVY SLIDE!', 645, 395, 15, '#ffd23c', 'center', '900');
  } else {
    drawGobble(300, 474 + R.y, 1.15, t, {burst: R.burstT > 0, speed:true});
  }
  /* particles */
  for(const pt of R.parts){ ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  /* leg tip banner at start */
  if(R.dist < 420){ darkPill(300, 120, 560, 44); txt(L.tip, 580, 142, 15, '#fff3d6', 'center'); }
  if(eventBanner && eventT > 0){ banner(eventBanner.name, CAST[eventBanner.caller].name + ': ' + eventBanner.line, '#ff9a5a'); }
  if(toast && toastT > 0){ darkPill(W/2-180, 660, 360, 34); txt(toast, W/2, 677, 14, '#fff3d6', 'center'); }
  if(R.stunT > 0){ darkPill(300 - R.hankGap - 60, 330, 130, 30); txt('STUNNED!', 300 - R.hankGap + 5, 345, 14, '#ffd23c', 'center', '900'); }
  drawHUD();
  if(paused){ ctx.fillStyle='rgba(20,10,5,0.6)'; ctx.fillRect(0,0,W,H);
    txt('PAUSED — press P to run', W/2, H/2, 34, '#fff', 'center', '900'); }
}

/* ---------- ?shot= STAGING (fixed seed, deterministic) ---------- */
function stageShot(kind){
  seed = 20261128;
  if(kind==='play'){
    /* leg 2 Cornfield Maze mid-run: burst + decoy + gravy slide under Gobble */
    startLeg(1);
    R.dist = 1250; R.score = 2480; R.cornRun = 41; R.combo = 9; R.bestCombo = 12;
    R.burstT = 0.9; R.sliding = true; R.slideT = 1.0; profile.slideCount = 3;
    R.decoy = {x: 165, y: 470, life: 1.5};
    R.hankGap = 210;
    for(let i=0;i<9;i++) R.parts.push({x: 300 - i*6, y: 440 - (i%3)*18, vx:-60, vy:-40, life:1, col: i%2?'#fff3d6':'#c98a3a', r:5});
    eventBanner = EVENTS.find(e=>e.id==='feed'); eventT = 9;
    screen = 'play';
  } else if(kind==='title'){
    profile.legsCleared = [true, true, false, false, false, false, false];
    profile.corn = 240; profile.bestCombo = 12; profile.rushesDone = {feed:true, rain:true};
    screen = 'title';
  } else if(kind==='barn'){
    /* leg 4 The Old Barn: Marge stirring, Hank grabbing, oven flickering, knife quivering */
    startLeg(3);
    R.dist = 900; R.score = 1870; R.cornRun = 28; R.combo = 6;
    R.floodT = 0; eventBanner = EVENTS.find(e=>e.id==='gravy'); eventT = 9;
    R.helpers = [{name:'Marge', d: 700, y: 300}, {name:'Gus', d: 1100, y: 260}, {name:'Bramble', d: 1500, y: 300}];
    screen = 'play';
  } else if(kind==='shop'){
    profile.corn = 640; profile.legsCleared = [true, true, true, false, false, false, false];
    profile.upgrades = {boots:true, magnet:true};
    openShop();
  }
  render(1.35);
}

/* ---------- INPUT ---------- */
const keys = {};
window.addEventListener('keydown', (e)=>{
  if(e.key==='m' || e.key==='M'){ muted = !muted; return; }
  keys[e.key.toLowerCase()] = true;
  if(screen==='play'){
    if(e.key===' ' || e.key==='ArrowUp' || e.key==='w' || e.key==='W') { doJump(); e.preventDefault(); }
    if(e.key==='Shift') doBurst();
    if(e.key==='g' || e.key==='G') doGobble();
    if(e.key==='p' || e.key==='P') paused = !paused;
  } else if(e.key==='Enter'){
    if(screen==='title'){ screen = 'map'; }
    else if(screen==='map'){ startLeg(nextLeg()); }
    else if(screen==='shop'){ screen = 'map'; }
    else if(screen==='results'){ openShop(); }
    else if(screen==='caught'){ startLeg(legIdx); }
    else if(screen==='escaped'){ screen = 'map'; }
  } else if(screen==='map' && (e.key==='s' || e.key==='S')){ openShop(); }
  else if(screen==='shop'){
    if(e.key>='1' && e.key<='3' && shopOffer.length){ pickRefit(Number(e.key)-1); }
    else if(e.key>='1' && e.key<='3' && !shopOffer.length){ saveGame(Number(e.key)); toast='Saved to slot ' + e.key; toastT=2; }
  }
  if(e.key===' ' && screen!=='play') e.preventDefault();
});
window.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });
cv.addEventListener('click', (e)=>{
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (H / rect.height);
  if(screen==='title'){ if(my > 620 && my < 676) screen = 'map'; return; }
  if(screen==='map'){
    const pts = [[150,560],[300,470],[470,540],[640,440],[810,520],[980,430],[1140,520]];
    pts.forEach((p, i)=>{ if(Math.hypot(mx-p[0], my-p[1]) < 40) startLeg(i); });
    return;
  }
  if(screen==='shop'){
    UPGRADES.forEach((u, i)=>{ const x = 40 + (i%4)*310, y = 168 + Math.floor(i/4)*118;
      if(mx > x && mx < x+296 && my > y && my < y+104) buyUpgrade(u.id); });
    if(shopOffer.length){ shopOffer.forEach((c, i)=>{ const x = 40 + i*200, y = 462;
      if(mx > x && mx < x+190 && my > y && my < y+120) pickRefit(i); }); }
    return;
  }
  if(screen==='play'){ doJump(); }
});
function nextLeg(){ for(let i=0;i<7;i++) if(!profile.legsCleared[i]) return i; return 0; }

/* ---------- MAIN LOOP ---------- */
let lastT = 0, animT = 0;
function render(t){
  ctx.clearRect(0, 0, W, H);
  if(screen==='title') drawTitle(t);
  else if(screen==='map') drawMap(t);
  else if(screen==='shop') drawShop(t);
  else if(screen==='play') drawPlay(t);
  else if(screen==='results') drawResults(t);
  else if(screen==='caught') drawCaught(t);
  else if(screen==='escaped') drawEscaped(t);
}
function loop(ts){
  const dt = Math.min(0.05, (ts - lastT)/1000 || 0.016); lastT = ts; animT += dt;
  if(screen==='play' && !paused) updateRun(dt);
  if(eventT > 0) eventT -= dt;
  if(toastT > 0) toastT -= dt;
  render(animT);
  requestAnimationFrame(loop);
}

/* ---------- GOBBLE TEST API (used by the headless playtest driver) ---------- */
window.GOBBLE = {
  get screen(){ return screen; },
  get profile(){ return profile; },
  get run(){ return R; },
  get lastGrade(){ return lastGrade; },
  get lastScore(){ return lastScore; },
  get lastCorn(){ return lastCorn; },
  get shopOffer(){ return shopOffer; },
  get runLog(){ return runLog; },
  startLeg, openShop, buyUpgrade, pickRefit, saveGame, loadGame,
  doJump, doBurst, doGobble, fireEvent,
  nextLeg,
  state(){ return { screen, legIdx, leg: R ? R.leg : -1, dist: R ? Math.floor(R.dist) : 0,
    target: R ? R.target : 0, score: R ? R.score : 0, cornRun: R ? R.cornRun : 0,
    lives: R ? R.lives : 0, combo: R ? R.combo : 0, sliding: R ? R.sliding : false,
    slideCount: profile.slideCount, burstCount: profile.burstCount,
    pickups: R ? R.pickups.length : 0, hazards: R ? R.hazards.length : 0,
    gravy: R ? R.gravy.length : 0, helpers: R ? R.helpers.length : 0,
    rushes: Object.keys(profile.rushesDone).length, feats: Object.keys(profile.feats),
    corn: profile.corn, legsCleared: profile.legsCleared.slice(), scores: profile.scores.slice(),
    refits: profile.refits.slice(), upgrades: Object.keys(profile.upgrades) }; },
  /* test hooks: drive a leg to completion, force a hit, force a catch */
  finishLegNow(){ if(R){ R.dist = R.target; updateRun(0.016); } },
  hitNow(why){ if(R) loseLife(why || 'test hit'); },
  setDist(d){ if(R) R.dist = d; },
  teleportToGravy(){ if(R){ const g = R.gravy[0]; if(g){ R.dist = g.d; R.ground = true; } } },
  resetProfile(){ profile = freshProfile(); runLog = []; },
};

/* ---------- BOOT ---------- */
(function boot(){
  const q = new URLSearchParams(location.search);
  const shot = q.get('shot');
  loadGame(1);
  if(shot){ stageShot(shot); return; }
  startMusic();
  requestAnimationFrame(loop);
})();
