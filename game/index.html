function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pill(x,y,w,h,fill,stroke){rr(x,y,w,h,10);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke();}}
function txt(s,x,y,size,color,align,weight){ctx.fillStyle=color;ctx.font=(weight||'bold')+' '+size+'px Trebuchet MS,Verdana,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function bubble(x,y,w,h,lines){pill(x,y,w,h,'rgba(255,251,230,0.96)','#5b3a17');ctx.fillStyle='#3a2410';ctx.font='bold 13px Trebuchet MS,Verdana,sans-serif';ctx.textAlign='left';lines.forEach((L,i)=>ctx.fillText(L,x+10,y+18+i*16));}

function saveKey(n){return 'gobble-escape-save-'+(n||S.saveSlot);}
function saveGame(n){try{localStorage.setItem(saveKey(n),JSON.stringify({corn:S.corn,legsCleared:S.legsCleared,legScores:S.legScores,upgrades:S.upgrades,feats:S.feats,maple:S.maple}));}catch(e){}}
function loadGame(n){try{const d=JSON.parse(localStorage.getItem(saveKey(n))||'null');if(!d)return false;S.corn=d.corn;S.legsCleared=d.legsCleared||[];S.legScores=d.legScores||{};S.upgrades=d.upgrades||{};S.feats=d.feats||[];S.maple=!!d.maple;return true;}catch(e){return false;}}
function hasUp(id){return !!S.upgrades[id];}
function gradeFor(sc){return sc>=9000?'S':sc>=6000?'A':sc>=3500?'B':'C';}
let AC=null,themeTimer=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide){if(S.muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.setValueAtTime(vol||0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function sfx(name){if(name==='gobble'){tone(300,0.12,'square',0.14,520);setTimeout(()=>tone(260,0.12,'square',0.14,480),110);setTimeout(()=>tone(340,0.16,'square',0.14,560),230);}else if(name==='coin'){tone(880,0.09,'sine',0.12,1320);}else if(name==='jump'){tone(300,0.18,'sine',0.12,640);}else if(name==='hit'){tone(160,0.25,'sawtooth',0.16,70);}else if(name==='burst'){tone(500,0.3,'triangle',0.14,1200);tone(900,0.2,'sine',0.08,1800);}else if(name==='stun'){tone(700,0.1,'square',0.1,700);setTimeout(()=>tone(700,0.1,'square',0.1,700),140);}else if(name==='oven'){tone(90,0.4,'sawtooth',0.08,60);}else if(name==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.12),i*130));}}
function startTheme(){if(themeTimer||S.muted)return;const notes=[392,523,659,523,587,659,784,659];let i=0;themeTimer=setInterval(()=>{if(S.screen==='title'||S.screen==='map'){tone(notes[i%notes.length],0.22,'triangle',0.05);}i++;},260);}

 ctx.fillStyle='#a8642a';ctx.beginPath();ctx.ellipse(-20,2,12,9,0,0,6.2832);ctx.fill();
 for(let i=-2;i<=2;i++){const a=-0.5+i*0.45;ctx.fillStyle=i%2?'#c0392b':'#d95f1e';ctx.beginPath();ctx.ellipse(-24+Math.cos(a)*16,-14+Math.sin(a)*14,9,16,a,0,6.2832);ctx.fill();ctx.stroke();}
 ctx.fillStyle='#e8b04b';ctx.beginPath();ctx.ellipse(2,14,16,7,0,0,6.2832);ctx.fill();

 ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.arc(26,-14,13,0,6.2832);ctx.fill();ctx.stroke();

 ctx.strokeStyle='#e8b98a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-12,-46);ctx.lineTo(-24+lp,-30);ctx.moveTo(12,-46);ctx.lineTo(24-lp,-30);ctx.stroke();

/* ---- game flow ---- */
function startLeg(n){S.leg=n;S.screen='play';S.distance=0;S.score=S.score;S.lives=hasUp('clover')?4:3;S.combo=1;S.hankDist=120;S.stun=0;S.burst=hasUp('pouch')?3:2;S.burstMax=S.burst;S.gobble=100;S.py=0;S.vy=0;S.runT=0;S.paused=false;S.event=EVENTS[(n+Math.floor(S.corn/50))%4];buildField(n,n*13+7);S.msg='LEG '+n+' — '+LEGS[n-1].name;S.msgT=180;sfx('jump');}
function completeLeg(){const bonus=Math.floor(S.distance)+S.combo*100;const sc=S.score+bonus;S.legScores[S.leg]=sc;if(!S.legsCleared.includes(S.leg))S.legsCleared.push(S.leg);S.feats.push('Leg '+S.leg+' cleared: '+LEGS[S.leg-1].name);if(S.leg===3)S.maple=true;S.results={score:sc,corn:Math.floor(S.distance/10)+20,leg:S.leg,grade:gradeFor(sc)};S.corn+=S.results.corn;S.score=sc;S.grade=S.results.grade;saveGame();if(S.leg===7){S.screen='escaped';sfx('win');}else{S.screen='results';sfx('win');}}
function loseLife(reason){if(hasUp('legs')&&!S._sturdyUsed){S._sturdyUsed=true;S.msg='Sturdy Legs saved you!';S.msgT=120;return;}S.lives--;S.combo=1;S.hitFlash=30;sfx('hit');if(S.lives<=0){S.caughtReason=reason||'The oven and the knife were faster.';S.screen='caught';}else{S.msg='Hit! '+S.lives+' lives left';S.msgT=120;}}
function doGobble(){if(S.gobble<30)return;S.gobble-=30;sfx('gobble');if(S.stun<=0&&S.hankDist<90){S.stun=hasUp('horn')?180:120;S.hankDist+=60;S.score+=150;sfx('stun');S.msg='GOBBLE STUN! Hank freezes!';S.msgT=120;}else{S.msg='Gobble! Biscuit runs faster…';S.msgT=90;S.hankDist=Math.max(20,S.hankDist-20);}}
function doBurst(){if(S.burst<=0)return;S.burst--;S.burstFx=40;S.decoy=180;S.hankDist+=70;S.score+=100;sfx('burst');S.msg='FEATHER BURST! Decoy in the corn!';S.msgT=120;}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u||hasUp(id))return false;if(S.corn<u.price){S.msg='Not enough corn for '+u.name;S.msgT=120;return false;}S.corn-=u.price;S.upgrades[id]=true;sfx('coin');S.msg=u.name+' bought!';S.msgT=120;saveGame();return true;}
function update(dt){if(S.screen!=='play'||S.paused)return;S.runT+=dt;S.distance+=dt*0.9*(hasUp('boots')?1.25:1);S.score+=Math.floor(dt*2);
 if(S.stun>0)S.stun-=dt;else S.hankDist-=dt*(S.event.name==='FEED-TIME RUSH'?0.9:0.45)*(hasUp('quiet')?0.6:1);
 if(S.hankDist<0){loseLife('Hank caught you from behind!');S.hankDist=140;}
 if(S.py!==0||S.vy!==0){S.vy+=0.9;S.py+=S.vy;if(S.py>=0){S.py=0;S.vy=0;S.jumping=false;}}
 if(S.burstFx>0)S.burstFx-=dt;if(S.decoy>0)S.decoy-=dt;if(S.hitFlash>0)S.hitFlash-=dt;if(S.msgT>0)S.msgT-=dt;
 S.gobble=Math.min(100,S.gobble+dt*0.4);
 for(const p of pickups){if(p.taken)continue;const dx=p.x-S.px,dy=(p.y)-(S.groundY-40+S.py);const rad=hasUp('magnet')?70:44;if(Math.abs(dx)<rad&&Math.abs(dy)<rad){p.taken=true;const val=p.kind==='gold'?5:1;S.corn+=val*(S.event.name==='RAIN SHOWER'?2:1);S.score+=10*val*S.combo;S.combo=Math.min(5,S.combo+1);S.bestCombo=Math.max(S.bestCombo,S.combo);sfx('coin');}}
 for(const hz of hazards){const dx=hz.x-S.px;if(Math.abs(dx)<34&&S.py>-40){if(hz.type==='oven'&&S.leg===4){if(!hasUp('scarf'))loseLife('The oven heat got you!');S.hankDist+=10;}else if(hz.type==='knife'){loseLife('The carving knife caught you!');hz.x+=400;}else if(hz.type==='trap'){loseLife('A trap snapped shut!');hz.x+=500;}}}
 if(S.distance>=900)completeLeg();}
function draw(t){ctx.clearRect(0,0,W,H);clickables=[];if(S.screen==='title')drawTitle(t);else if(S.screen==='map')drawMap(t);else if(S.screen==='shop')drawShop(t);else if(S.screen==='play')drawPlay(t);else if(S.screen==='results')drawResults(t);else if(S.screen==='caught')drawCaught(t);else if(S.screen==='escaped')drawEscaped(t);}
/* ---- staged screenshots: fixed seed, deterministic ---- */
function stageShot(){if(SHOT==='play'){S.leg=2;S.screen='play';S.score=1240;S.corn=87;S.distance=412;S.combo=3;S.bestCombo=3;S.lives=3;S.hankDist=64;S.gobble=72;S.burst=2;S.burstFx=40;S.decoy=180;S.event=EVENTS[3];buildField(2,33);S.runT=12;}
 else if(SHOT==='barn'){S.leg=4;S.screen='play';S.score=980;S.corn=64;S.distance=300;S.combo=2;S.lives=2;S.hankDist=80;S.gobble=55;S.burst=1;S.event=EVENTS[0];buildField(4,47);S.runT=9;}
 else if(SHOT==='shop'){S.screen='shop';S.corn=240;S.upgrades={boots:true};S.legsCleared=[1,2];S.leg=3;}
 else if(SHOT==='title'){S.screen='title';S.legsCleared=[1];}
 else{S.screen='title';}}
if(SHOT){stageShot();draw(1.2);window.__shotDone=true;}
let last=performance.now();
function loop(now){const dt=Math.min(3,(now-last)/16.7);last=now;if(!SHOT){update(dt);draw(now/1000);}requestAnimationFrame(loop);}
if(!SHOT)requestAnimationFrame(loop);
/* ---- input ---- */
function jump(){if(S.screen==='play'&&!S.jumping){S.vy=-16;S.jumping=true;sfx('jump');}}

 if(S.screen==='play'){if(k==='arrowup'||k==='w')jump();else if(k===' '){e.preventDefault();doGobble();}else if(k==='shift')doBurst();else if(k==='arrowright'||k==='d')S.px=Math.min(900,S.px+14);else if(k==='arrowleft'||k==='a')S.px=Math.max(120,S.px-14);}
 else if(S.screen==='results'&&k==='enter'){S.leg=Math.min(7,S.leg+1);startLeg(S.leg);}
 else if((S.screen==='caught'||S.screen==='escaped')&&k==='enter'){S.screen='map';}});
cv.addEventListener('click',e=>{startTheme();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 for(const c of clickables){if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){handleAction(c.act);return;}}
 if(S.screen==='play')jump();});
function handleAction(a){if(a==='map'){S.screen='map';}else if(a==='shop'){S.screen='shop';}else if(a==='save'){saveGame();S.msg='Saved to slot '+S.saveSlot;S.msgT=120;}else if(a==='title'){S.screen='title';}else if(a==='pause'){S.paused=!S.paused;}else if(a==='quit'){S.screen='map';}else if(a==='nextleg'){S.leg=Math.min(7,(S.results?S.results.leg:S.leg)+1);startLeg(S.leg);}else if(a==='retry'){startLeg(S.leg);}else if(a==='again'){S.score=0;S.corn=500;S.legsCleared=[];S.legScores={};S.leg=1;S.screen='title';}else if(a==='runnext'){startLeg(S.leg);}else if(a.startsWith('leg')){startLeg(+a.slice(3));}else if(a.startsWith('buy:')){buyUpgrade(a.slice(4));}}
window.GOBBLE={state:()=>JSON.parse(JSON.stringify({screen:S.screen,leg:S.leg,score:S.score,corn:S.corn,distance:S.distance,combo:S.combo,bestCombo:S.bestCombo,lives:S.lives,legsCleared:S.legsCleared,legScores:S.legScores,upgrades:S.upgrades,burst:S.burst,gobble:S.gobble,hankDist:S.hankDist,grade:S.grade,results:S.results,caughtReason:S.caughtReason,maple:S.maple})),
 startLeg,completeLeg,loseLife,doGobble,doBurst,buyUpgrade,saveGame,loadGame,
 toMap:()=>{S.screen='map';},toShop:()=>{S.screen='shop';},toTitle:()=>{S.screen='title';},
 forceCaught:()=>{S.lives=1;loseLife('Forced caught for playtest.');},
